name: HookHub CI

on:
  push:
    branches: [main]
    paths: ["hookhub/**"]
  pull_request:
    branches: [main]
    paths: ["hookhub/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hookhub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hookhub/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
