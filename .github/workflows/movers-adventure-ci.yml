name: Movers Adventure CI

on:
  push:
    branches: [main]
    paths: ["movers-adventure/**"]
  pull_request:
    branches: [main]
    paths: ["movers-adventure/**"]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movers-adventure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Validate HTML
        run: npx --yes html-validate@8 index.html

      - name: Install Playwright (CI-only dependency, not committed to the repo)
        run: |
          npm init -y --silent
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Smoke test (load the page, fail on any console/page error)
        run: node smoke-test.mjs
