name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    paths: ["hookhub/**"]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This repository is a monorepo. Only review changes under the `hookhub/`
            folder (the ClaudeCodeHub Next.js project) — ignore anything outside it.

            Focus exclusively on code elegance and quality, not on functional
            correctness or product behavior:

            1. **Formatting & style**
               - Consistent with the project's ESLint flat config (`eslint-config-next`,
                 core-web-vitals + TypeScript presets) and existing code conventions
               - Consistent naming, indentation, import ordering

            2. **DRY (Don't Repeat Yourself)**
               - Duplicated logic, repeated JSX/markup, copy-pasted conditionals
               - Opportunities to extract shared components, hooks, or utilities
               - Also flag over-abstraction — don't reward premature generalization

            3. **Cyclomatic complexity**
               - Deeply nested conditionals/loops, long functions, functions doing too much
               - Suggest concrete simplifications (early returns, guard clauses, extracted helpers)

            4. **Code quality**
               - Clear, descriptive naming; type safety (TypeScript strict mode)
               - Dead code, unused imports/variables
               - Idiomatic Next.js 16 / React 19 / TypeScript patterns

            5. **Security**
               - Unsafe use of user input (XSS, injection)
               - Leaked secrets or credentials
               - Unsafe external links, `dangerouslySetInnerHTML`, missing input validation

            Post specific, actionable feedback as inline comments on the exact lines
            with issues. Use a single top-level summary comment for overall observations.
            Skip praise-only comments — only report actionable findings.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
